<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if..else문</title>
</head>
<body>

    <!-- 
        조건문 
        = 주어진 조건식의 평가 결과에 따라 코드 블록(블록문)의 실행을 결정한다
        = 조건식은 불리언 값으로 평가될 수 있는 표현식

        1. if..else문
        = 주어진 조건식(불리언 값으로 평가될 수 있는 표현식)의 평가 결과 즉 논리적 참 또는 거짓에 따라 실행할 코드 블록을 결정
        = 조건식의 평가 결과가 true일 경우 if 문의 코드 블록이 실행되고 false일 경우 else 문의 코드 블록이 실행
            ex)
            if(조건식){
                // 조건식이 true일 때 실행할 코드 블록
            } else {
                // 조건식이 false일 때 실행할 코드 블록
            }
        
        = if문의 조건식은 블리언 값으로 평가
        = 만약 if 문의 조건식이 불리언 값이 아닌 값으로 평가되면 자바스크립트 엔진에 의해 암묵적으로 불리언 값으로 강제 변환되어 실행할 코드 블록을 결정
        = 조건식을 추가하여 조건에 따라 실행될 코드 블록을 늘리고 싶으면 'else if'문을 사용
            ex)
            if(조건식1){
                // 조건식1이 true일 때 실행할 코드 블록
            } else if(조건식2){
                // 조건식1이 false이고 조건식2가 true일 때 실행할 코드 블록
            } else {
                // 조건식1과 조건식2가 모두 false일 때 실행할 코드 블록
            }

        = else if 문과 else 문은 옵션
        = 즉 사용할 수도 있고 사용하지 않을 수 있다
        = if 문과 else 문은 2번 이상 사용할 수 없지만 else if 문은 여러 번 사용할 수 있다
        = 대부분의 if..else문은 삼항 조건 연산자로 바꿔 쓸 수 있다

            ex) 
                var kind = num ? (num > 0 ? '양수' : '음수') : '영';
                console.log(kind); // 양수

        = '(num > 0 ? '양수' : '음수')는 표현식'
        = 즉 삼항 조건 연산자는 값으로 평가되는 표현식을 만든다
        = 따라서 삼항 조건 연산자는 표현식은 값처럼 사용할 수 있기 때문에 변수에 할당할 수 있다 
        = 하지만 if..else 문은 표현식이 아닌 문이다 따라서 if...else 문은 값처럼 사용할 수 없기 때문에 변수에 할당할 수 없다
        = 조건에 따라 단순히 값을 결정하여 변수에 할당하는 경우 '삼항 조건 연산자'를 사용하는 편이 가독성이 좋다
        = 내용이 복잡하여 여러 줄의 문의 필요하다면 'if...else문'을 사용하는 편이 가독성이 좋다

        trim : 문자열의 앞과 뒤에 있는 공백을 제거하는 메서드
    -->


    <script>
        /*
            아이디가 "admin" 이고
            비밀번호가 "1234"
        */

        // if (id !== 'admin' && Number(password) !== 1234) {
        //     alert('둘 다 틀립니다');
        // } else if (id !== 'admin') {
        //     alert('아이디가 틀립니다');
        // } else if (Number(password) !== 1234) {
        //     alert('비밀번호가 틀립니다');
        // } else {
        //     alert('로그인 성공');
        // }

        let id = 'admin';
        let password = Number(prompt('비밀번호 입력'));

        if(id !== 'admin' && Number(password) !== 1234){
            alert('둘 다 틀립니다');
        }else if(id !== 'admin'){
            alert('아이디가 틀립니다');
        }else if(Number(password) !== 1234){
            alert('비밀번호가 틀립니다');
        }else{
            alert('로그인 성공')
        }
    </script>
    
</body>
</html>
