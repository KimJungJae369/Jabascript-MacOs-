<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do...while문</title>
</head>
<body>

    <!-- 
        do...while문
        = 코드 블록을 먼저 실행하고 조건식을 평가
        = 따라서 코드 블록은 무조건 한 번 이상 실행된다
    -->

    <script>
        var count = 0;

        do{
            console.log(count);
            count++;
        }while(count < 3); 
    </script>
    
</body>
</html>
