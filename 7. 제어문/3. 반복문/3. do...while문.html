<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do...while문</title>
</head>
<body>

    <!-- 
        do...while문
        = '코드 블록을 먼저 실행하고 조건식을 평가'
        = 따라서 코드 블록은 무조건 한 번 이상 실행된다

    -->

    <script>
        /*
            1. attack 변수를 1로 선언한다.
            2. do...while문을 사용한다.
            3. 반복할 때마다 아래와 같이 출력한다.
                * 1번째 공격!
                * 2번째 공격!
                * …
                * 5번째 공격!
            4. 반복이 끝나면 "전투 종료"를 출력한다.
            5. 템플릿 리터럴을 사용한다.
        */

        let attack = 1;

        do{
            console.log(`${attack}번째 공격`);
            attack++;
        }while(attack <= 5);
        console.log('전투 종료');
    </script>
    
</body>
</html>
