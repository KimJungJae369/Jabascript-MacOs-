<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do...while문</title>
</head>
<body>

    <!-- 
        do...while문
        = '코드 블록을 먼저 실행하고 조건식을 평가'
        = 따라서 코드 블록은 무조건 한 번 이상 실행된다

    -->

    <script>
        /*
            1. do while 문 사용하기
            2. password 변수 만들기
            3. 처음 비밀번호는 틀린 값으로 시작하기
            4. 반복
        */
        let password = '1111';

        do{
            console.log('비밀번호 확인 중');
            password = '1234';
        } while (password !== '1234');

        console.log('로그인 성공');
    </script>
    
</body>
</html>
