<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do...while문</title>
</head>
<body>

    <!-- 
        do...while문
        = '코드 블록을 먼저 실행하고 조건식을 평가'
        = 따라서 코드 블록은 무조건 한 번 이상 실행된다

    -->

    <script>
        /*
            1. do...while문을 사용한다.
            2. 현재 레벨을 출력한다.
            3. 출력 후 level을 1 증가시킨다.
            4. 레벨이 5가 될 때까지 반복한다.
        */

        let level = 1;

        do{
            console.log(`현재 레벨 : ${level}`);
            level++;
        }while(level <= 5);
    </script>
    
</body>
</html>
