<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do...while문</title>
</head>
<body>

    <!-- 
        do...while문
        = '코드 블록을 먼저 실행하고 조건식을 평가'
        = 따라서 코드 블록은 무조건 한 번 이상 실행된다

    -->

    <script>
        /*
            정답 숫자는 7 입니다.

            사용자가 숫자를 계속 입력하다가
            7을 맞히면 게임이 끝나는 프로그램을 만드세요.
        */

        let answer = 7;
        let input;

        // do {
        //     input = Number(prompt("숫자를 입력하세요"));

        //     if (input === answer) {
        //         alert("정답입니다");
        //     } else {
        //         alert("틀렸습니다");
        //     }

        // } while (input !== answer);

        do{
            input = Number(prompt('숫자입력'));

            if(input === answer){
                alert('정답')
            }else{
                alert('틀립니다');
            }
        }while(input !== answer);
    </script>
    
</body>
</html>
