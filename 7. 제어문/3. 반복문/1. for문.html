<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for문</title>
</head>
<body>

    <!-- 
        반복문
        = 조건식의 평가 결과가 '참'인 경우 블록을 실행한다
        = 그 후 조건식을 다시 평가하여 여전히 '참'인 경우 코드 블록을 다시 실행
        = 이는 조건식이 '거짓'일 때까지 반복
        = 자바스크립트는 세 가지 반복문인 'for문', 'while 문', 'do...while 문'을 제공

        1. for문
        = 조건식이 '거짓'으로 평가될 때까지 코드 블록을 실행
        = 가장 일반적으로 사용
            ex)
                for(변수 선언문 또는 할당문; 조건식; 증감식){
                    조선식이 '참'인 경우 반복 실행될 문;
                }
        = for문은 가장 중요하다

            ex)
                for(let i = 0; i < 2; i++){
                    console.log(i); // 0,1
                }
                - 위 예제의 for문은 i변수(for문의 변수 선언문의 변수 이름은 반복을 의미하는 'iteratione = i'를 사용하는 것이 일반적)가 0으로 초기화된 상태에서 시작하여
                i가 2보다 작을 때까지 코드 블록을 2번 반복 실행

                for(let i = 0(1); i < 2(2,5,8); i++(4,7)){
                    console.log(i); (3 : i = 0, 6 : i = 1)
                }
                1. for문을 실행하면 맨 먼저 변수 선언문 let i = 0;이 실행 변수 선언문은 '단 한번만 실행된다'
                2. 변수 선언문의 실행이 종료되면 조건식이 실행 현재 i 변수의 값은 0이므로 조건식의 평가 결과는 true
                3. 조건식의 평가 결과가 true이므로 코드 블록이 실행 증감문으로 실행 흐름이 이동하는 것이 아니라 코드 블록으로 실행 흐름이 이동하는 것에 주의
                4. 코드 블록이 실행이 종료되면 증감식 i++가 실행되어 i 변수의 값은 1로 증가
                5. 증감식 실행이 종료되면 다시 조건식이 실행 변수 선언문이 실행되는 것이 아니라 조건식이 실행된다는 점에 주의(변수 선언문은 단 한번만 실행) 현재 i 변수의 값은 
                    1이므로 조건식의 평가 결과는 true
                6. 조건식의 평가 결과가 true이므로 코드 블록이 다시 실행
                7. 코드 블록의 실행 종료되면 증감식 i++가 실행되어 i 변수 값은 2가 된다
                8. 증감식 실행이 종료되면 다시 조건식이 실행 현재 i 변수의 값은 2이므로 조건식의 평가 결과는 false 조건식의 평가 결과가 false이므로 for문의 실행이 종료

        = for문의 변수 선언문, 조건식, 증감식은 모두 옵션이므로 반드시 사용할 필요는 없다
        = 단 어떤 식도 선언하지 않으면 '무한루프'가 돤다 
        무한루프 : 코드 블록을 무한히 반복 실행하는 문
            ex)
                for(;;){...}
        
        2. 중첩 for문
        = for문 내에 for문을 중첩한 문
    -->

    <script>
        /*
            1. for문을 사용하여 1부터 10까지 반복한다.
            2. if문을 사용하여 다음 조건을 만족한다.
                * 짝수 번호 학생이면 "N번 학생 합격"을 출력한다.
                * 홀수 번호 학생이면 "N번 학생 불합격"을 출력한다.
            3. 문자열은 템플릿 리터럴을 사용한다
        */
    
        for(let i = 1; i <= 10; i++){
            if(i % 2 === 0){
                console.log(`${i}번 학생 합격`);
            }else{
                console.log(`${i}번 학생 합격`);
            }
        }
    </script>
    
</body>
</html>
