<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while문</title>
</head>
<body>

    <!-- 
        2. while문
        = 주어진 조건식의 평가 결과가 '참'이면 코드 블록을 계속해서 실행
        = 'for문'은 반복 횟수가 명확 할때 주로 사용 'while 문'은 반복횟수가 불명확 할때 주로 사용
        = 'while 문'은 조건문의 평가 결과가 거짓이 되면 코드 블록을 실행하지 않고 종료
        = 만약 조건식의 평가 결과가 블리언 값이 아니면 블리언 값으로 강제 변환하여 논리적 '참, 거짓'을 구별
        = 조건식의 평가 결과가 언제나 '참'이면 '무한 루프'에 빠진다
            ex) while(true){...}
        = 무한루프에서 탈출하기 위해서는 코드 블록 내에 'if문'으로 탈출 조건을 만들거나 'break문'으로 코드 블록을 탈출한다
    -->

    <script>
        /*
            1. count 변수를 1로 선언한다.
            2. while문을 사용하여 count가 5 이하인 동안 반복한다.
            3. 반복할 때마다 아래와 같이 출력한다.
                * 1번째 음료 진열 완료
                * 2번째 음료 진열 완료
                * …
                * 5번째 음료 진열 완료
            4. 템플릿 리터럴을 사용한다.
            5. 반복이 끝나면 "모든 음료 진열 완료"를 출력한다
        */

        let count = 1;

        while (count <= 5) {
            console.log(`${count}번째 음료 진열 완료`);
            count++;
        }

        console.log("모든 음료 진열 완료");
    </script>
    
</body>
</html>
