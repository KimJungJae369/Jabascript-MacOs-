<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while문</title>
</head>
<body>

    <!-- 
        2. while문
        = 주어진 조건식의 평가 결과가 '참'이면 코드 블록을 계속해서 실행
        = 'for문'은 반복 횟수가 명확 할때 주로 사용 'while 문'은 반복횟수가 불명확 할때 주로 사용
        = 'while 문'은 조건문의 평가 결과가 거짓이 되면 코드 블록을 실행하지 않고 종료
        = 만약 조건식의 평가 결과가 블리언 값이 아니면 블리언 값으로 강제 변환하여 논리적 '참, 거짓'을 구별
        = 조건식의 평가 결과가 언제나 '참'이면 '무한 루프'에 빠진다
            ex) while(true){...}
        = 무한루프에서 탈출하기 위해서는 코드 블록 내에 'if문'으로 탈출 조건을 만들거나 'break문'으로 코드 블록을 탈출한다
    -->

    <script>
        /*
            비밀번호를 맞출 때까지 계속 입력받는데,
            3번 틀리면 계정을 잠그는 프로그램을 만들어보세요.

            조건
            * 정답 비밀번호는 "1234"
            * 틀릴 때마다:
        */

        let password = '1234';
        let input = '';
        let count = 0;

        // while(count < 3){
        //     input = prompt('비밀번호를 입력하세요');

        //     if(input === password){
        //         alert('로그인 성공');
        //         break;
        //     }else{
        //         alert('비밀번호가 틀립니다');
        //         count++;
        //     }
        // }

        //     if(count === 3){
        //         alert('계정이 잠겼습니다');
        //     }

        while(count < 3){
            input = prompt('비밀번호 입력');

            if(input === password){
                alert('로그인 성공');
                break;
            }else{
                alert('비밀번호가 틀립니다');
                count++;
            }
        }
        if(count === 3){
            alert('계정이 잠겼습니다');
        }
    </script>
    
</body>
</html>
