<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while문</title>
</head>
<body>

    <!-- 
        2. while문
        = 주어진 조건식의 평가 결과가 '참'이면 코드 블록을 계속해서 실행
        = 'for문'은 반복 횟수가 명확 할때 주로 사용 'while 문'은 반복횟수가 불명확 할때 주로 사용
        = 'while 문'은 조건문의 평가 결과가 거짓이 되면 코드 블록을 실행하지 않고 종료
        = 만약 조건식의 평가 결과가 블리언 값이 아니면 블리언 값으로 강제 변환하여 논리적 '참, 거짓'을 구별
        = 조건식의 평가 결과가 언제나 '참'이면 '무한 루프'에 빠진다
            ex) while(true){...}
        = 무한루프에서 탈출하기 위해서는 코드 블록 내에 'if문'으로 탈출 조건을 만들거나 'break문'으로 코드 블록을 탈출한다
    -->

    <script>
        /*
            1. while문을 사용한다.
            2. input이 password와 같아질 때까지 반복한다.
            3. 반복할 때마다 "비밀번호가 틀렸습니다."를 출력한다.
            4. 반복문 안에서 input을 1234로 변경한다. (사용자가 다시 입력했다고 가정)
            5. 반복문이 끝나면 "로그인 성공"을 출력한다.
        */

        let password = 1234;
        let input = 1111;

        while(input !== password){
            console.log('비밀번호가 틀렸습니다');
            input = 1234;
        }
        console.log('로그인 성공');
    </script>
    
</body>
</html>
