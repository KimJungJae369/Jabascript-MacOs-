<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블록문</title>
</head>
<body>

    <!-- 
        제어문
        = 조건에 따라 코드 블록을 '실행(조건문)'하거나 '반복 실행(반복문)'할 때 사용
        = 일반적으로 코드는 위에서 아래 방향으로 순차적으로 실행
        = 제어문을 사용하면 코드의 실행 흐름을 인위적으로 제어할 수 있다
        = 하지만 코드의 실행 순서가 변경된다는 것은 단순히 위에서 아래로 순차적으로 진행하는 직관적인 코드의 흐름을 혼란스럽게 만든다
        = 따라서 제어문은 코드의 흐름을 이해하기 어렵게 만들어 가독성을 해치는 단점
        = 가독성이 좋지 않은 코드는 오류를 발생시키는 원인이 된다 
        = '고차 함수'를 사용한 함수형 프로그래밍 기법에서는 제어문의 사용을 억제하여 복잡성을 해결


        1. 블록문
        = 0개 이상의 문을 중괄호 묶은 것으로 코드 블록 또는 블록이라고 부르기도 한다
        = 자바스크립트는 블록문을 하나의 실행 단위로 취급
        = 블록문은 단독으로 사용할 수도 있으나 일반적으로 제어문이나 함수를 정의할 때 사용하는 것이 일반적
        = 문의 끝에는 세미클론을 붙이는 것이 일반적
        = 자체 종결성을 갖기 때문에 블록문의 끝에는 세미클론을 붙이지 않는다는 것에 주의
    -->

    <script>
        // 블록문
        {
            var  foo = 10;
        }
        console.log(foo); // 10

        // 제어문
        var x = 1;
        if(x < 10){
            x++;
        }
        console.log(x); // 2

        // 함수 선언문
        function sum(a,b){
            return a + b;
        }
        console.log(sum(2, 3)); // 5

    </script>
    
</body>
</html>
