<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>break문</title>
</head>
<body>

    <!-- 
        break문
        = 코드 블록을 탈출
        = 좀 더 정확히 표현하면 코드 블록을 탈출하는 것이 아니라 '레이블 문, 반복문 또는 switch문'의 코드 블록을 탈출한다
        = '레이블 문, 반목문, switch문'의 코드 블록 외에 break문을 사용하면 'SyntaxError(문법 에러)'가 발생
            레이블 문 : 식별자가 붙은 문 => foo : console.log('foo');
            ex)
                if(true){break;} => SyntaxError
                
        = 레이블 문은 프로그램의 실행 순서를 제어하는 데 사용
        = 사실 switch문의 case 문과 default 문도 레이블 문이다
        = 레이블 문을 탈출하려면 break문에 레이블 식별자를 지정
            ex)
                foo : {   // foo라는 식별자가 붙은 레이블 문
                    console.log(1);
                    break foo;  // foo 레이블 블록문을 탈출
                    console.log(2);
                }
                console.log('Done!');

        = 중첩 for문의 내부 for문에서 break 문을 실행하면 내부 for문을 탈출하여 외부 for 문으로 진입
        = 이때 내부 for문이 아닌 외부 for문을 탈출하려면 레이블 문을 사용
            ex)
                outer : for(let i = 0; i < 3; i++){
                    for(let j = 0; j < 3; j++){
                        // i + j === 3이면 outer라는 식별자가 붙은 레이블 for 문을 탈출
                        if(i + j ===3)berak outer;
                        console.log(`inner [${i}, ${j}]`);
                    }
                }
                console.log('Done!');
                

        = 레이블 문은 중첩된 for문 외부로 탈출할 때 유용하지만 그 밖의 경우에는 일반적으로 권장하지 않는다
        = 레이블 문을 사용하면 프로그램의 흐름이 복잡해져서 가독성이 나빠지고 오류를 발생시킬 가능성이 높아진다
        = break 문은 반복문을 더 이상 진행하지 않아도 될 때 불필요한 반복을 회피할 수 있다

        string.prototype.indexOf 
        = 문자열 안에서 특정 문자(또는 문자열)가 몇 번째 위치에 있는지 찾는 메서드
        = 즉 '이 글자가 어디에 있지?'를 찾는 기능
    -->

    <script>
        const names = ['김철수', '이영희', '박민수', '최지은', '홍길동'];

        for(let i = 0; i < names.length; i++){
            if(names[i].indexOf('민') !== -1){
                console.log(`찾았습니다 ${names[i]}`);
                break;
            }
        }
    </script>
    
</body>
</html>
