<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>continue문</title>
</head>
<body>

    <!-- 
        continue문
        = 반복문의 코드 블록 실행을 현 지점에서 중단하고 반복문의 증감식으로 실행 흐름을 이동시킨다
        = break 문처럼 반복문을 탈출하지는 않는다
    -->

    <script>
        /*
            1. for문을 사용한다.
            2. 학생 이름을 하나씩 출력한다.
            3. "박민수"는 결석했으므로 출력하지 않는다.
            4. "박민수"를 만나면 continue를 사용해 다음 학생으로 넘어간다.
        */

        let students = ["김철수", "이영희", "박민수", "최지은", "홍길동"];

        for(let i = 0; i <= students.length; i++){
            if(students[i] === '박민수'){
                continue;
            }

            console.log(students[i]);
        }
    </script>
    
</body>
</html>
