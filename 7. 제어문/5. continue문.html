<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>continue문</title>
</head>
<body>

    <!-- 
        continue문
        = 반복문의 코드 블록 실행을 현 지점에서 중단하고 반복문의 증감식으로 실행 흐름을 이동시킨다
        = break 문처럼 반복문을 탈출하지는 않는다
    -->

    <script>
        /*
            1. 상품 이름에 "폰"이 포함되어 있으면 continue를 사용해서 건너뛴다.
            2. "폰"이 포함되지 않은 상품만 출력한다.
            3. indexOf()를 반드시 사용한다.
            4. break는 사용하지 않는다.

            확인한 상품 : 노트북
            확인한 상품 : 키보드
            확인한 상품 : 마우스
            확인한 상품 : 모니터
        */ 
        const products = ['노트북', '키보드', '아이폰', '마우스', '갤럭시폰', '모니터'];
        // for(let i = 0; i < products.length; i++){
        //     if(products[i].indexOf('폰') !== -1){
        //         continue;
        //     }
        //     console.log(`확인한 상품 : ${products[i]}`);
        // }


        for(let i = 0; i < products.length; i++){
            if(products[i].indexOf('폰') !== -1){
                continue;
            }
            console.log(`확인한 상품 : ${products[i]}`);
        }
    </script>
    
</body>
</html>
