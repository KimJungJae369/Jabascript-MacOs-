<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        var 
        = 재할당/재선언/호이스팅 모두 가능하다
        = var는 코드에서 사용을 하지 않는 것이 좋다

        let 
        = 재할당은 가능하지만, 재선언이 불가능하다
        = 호이스팅은 일어나지만, TDZ(Temporal Dead Zone) 때문에 오류가 발생한다
        = let이 호이스팅이 발생하면 let 선언문 전체가 TDZ에 빠지게 된다
        TDZ : 변수의 유효 범위가 시작되는 시점부터 변수 선언이 실행되기 전까지의 영역

        const 
        = 재할당/재선언 모두 불가능하다
        = 호이스팅이 일어나지만, TDZ 때문에 오류가 발생한다
        = 객체의 내부 값, 배열 요소 변경은 가능하지만 변수에 대한 재할당은 불가능하다
        ex)
            const user = { name: 'Alice' };
            user.name = 'Bob'; // 객체 내부 값 변경은 가능
            user = { name: 'Charlie' }; // 오류 발생, 변수에 대한 재할당은 불가능
    -->

    <script>
        const userName = 'John'; // 재선언과 재할당이 불가능한 상수
        let userAge = 31; // 재선언은 불가능하지만, 재할당이 가능한 변수
 
        console.log(`Name : ${userName}, Age: ${userAge}`); // 초기값 출력

        userAge += 1; // userAge에 1을 더하여 재할당

        console.log(`Name : ${userName}, Age: ${userAge}`); // userName은 재할당이 불가능하므로 그대로 'John'이 출력되고, userAge는 1이 더해져서 32가 출력된다
    </script>
    
</body>
</html>
