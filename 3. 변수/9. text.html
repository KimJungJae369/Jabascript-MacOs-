<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        var 
        = 재할당/재선언/호이스팅 모두 가능하다
        = var는 코드에서 사용을 하지 않는 것이 좋다

        let 
        = 재할당은 가능하지만, 재선언이 불가능하다
        = 호이스팅은 일어나지만, TDZ(Temporal Dead Zone) 때문에 오류가 발생한다
        = let이 호이스팅이 발생하면 let 선언문 전체가 TDZ에 빠지게 된다
        TDZ : 변수의 유효 범위가 시작되는 시점부터 변수 선언이 실행되기 전까지의 영역

        const 
        = 재할당/재선언 모두 불가능하다
        = 호이스팅이 일어나지만, TDZ 때문에 오류가 발생한다
        = 객체의 내부 값, 배열 요소 변경은 가능하지만 변수에 대한 재할당은 불가능하다
        ex)
            const user = { name: 'Alice' };
            user.name = 'Bob'; // 객체 내부 값 변경은 가능
            user = { name: 'Charlie' }; // 오류 발생, 변수에 대한 재할당은 불가능
    -->

    <script>
        /*
            1. userName이라는 변수를 선언하고 "김철수"를 할당한다.
            2. 나이를 저장하는 변수를 선언하고 20을 할당한 뒤, 재할당해서 21로 변경한다.
            3. console.log()로 이름과 나이를 출력한다.
            4. 식별자 네이밍 규칙을 지켜서 변수명을 작성한다.
            5. var를 사용해서 변수 하나를 선언하고, 호이스팅이 발생하는 것을 확인할 수 있도록 코드를 작성한다. (힌트: 선언보다 먼저 출력해 보기)
        */

        let userName = '김철수';
        let age = 20;
        age = 21;
        console.log(userName, age);

        var Hois;
        console.log(Hois);
        Hois = "안녕하세요";
    </script>
    
</body>
</html>
