<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불리언 타입으로 변환</title>
</head>
<body>

    <!-- 
        불리언 타입으로 변환
        (1) Boolean 생성자 함수를 new 연산자 없이 호출한는 방법
        (2) ! 부정 논리 연산자를 두 번 사용하는 방법
    -->

    <script>
        // 1. Boolean 생성자 함수를 new 연산자 없이 호출한는 방법
        // 문자열 -> 블리언 타입
        Boolean('x'); // -> true
        Boolean(''); // -> false
        Boolean('false'); // -> true

        // 숫자 -> 블리언 타입
        Boolean(0); // -> false
        Boolean(1); // -> true
        Boolean(NaN); // -> false
        Boolean(Infinity); // -> true

        // null -> 블리언 타입
        Boolean(null); // -> false

        // undefined -> 블리언 타입
        Boolean(undefined); // -> false

        // 객체 -> 블리언 타입
        Boolean({}); // -> true
        Boolean([]); // -> true



        // (2) ! 부정 논리 연산자를 두 번 사용하는 방법
        // 문자열 -> 블리언 타입
        !!'X'; // -> truer
        !!''; // -> false
        !!'false'; // -> true

        // 숫자 -> 블리언 타입
        !!0; // -> false
        !!1; // -> true
        !!NaN; // -> false
        !!Infinity; // -> true

        // null -> 블리언 타입
        !!null; // -> false

        // undefined -> 블리언 타입
        !!undefined; // -> false

        // 객체 -> 블리언 타입
        !!{}; // -> true
        !![]; // -> true
    </script>
    
</body>
</html>
