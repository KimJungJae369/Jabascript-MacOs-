<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 타입으로 변환</title>
</head>
<body>

    <!-- 
        숫자 타입으로 변환
        <숫자 타입이 아닌 값을 숫자 타입으로 변환하는 방법>
        (1) Number 생성자 함수를 new 연산자 없이 호출하는 방법
        (2) paresInt, parsefloat 함수를 사용하는 방법(문자열만 숫자 타입으로 변환 가능)
        (3) + 단항 산술 연산자를 이용한느 방법
        (4) * 산술 연산자를 이용하는 방법
    -->

    <script>
        // 1. Number 생성자 함수를 new 연산자 없이 호출하는 방법
        // 문자열 -> 숫자 타입
        Number('0'); // 0
        Number('-1'); // -1
        Number('10.53'); // 10.53

        // 블리언 -> 숫자
        Number(true); // 1
        Number(false); // 0

        // 2. paresInt, parsefloat 함수를 사용하는 방법(문자열만 숫자 타입으로 변환 가능)
        // 문자열 -> 숫자 타입
        parseInt('0'); // 0
        parseInt('-1'); // -1
        parseInt('10.53'); // 10.53

        // 3. + 단항 산술 연산자를 이용하는 방법
        // 문자열 -> 숫자 타입
        +0; // 0
        +'-1'; // -1
        +'10.53' // 10.53

        // 블리언 -> 숫자
        +true; // 1
        +false // 0

        // 4. * 산술 연산자를 이용하는 방법
        // 문자열 -> 숫자 타입
        '0' * 1; // 0
        '-1' * 1; // -1
        '10.53' * 1; // 10.53

        // 블리언 -> 숫자
        true * 1; // 1
        false * 1; // 0
    </script>
    
</body>
</html>
