<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 타입으로 변환</title>
</head>
<body>

    <!-- 
        명시적 타입 변환
        = 명시적으로 타입을 변경하는 방법은 다양하다 
        (1) 표준 빌트인 생성자 함수(string, number, boolean)를 new 연산자 없이 호출하는 방법
        (2) 빌트인 메서드를 사용하는 방법
        (3) 암묵적 타입 변환을 이용하는 방법

        1. 문자열 타입으로 변환 
        <문자열 타입이 아닌 값을 문자열 타입으로 변환하는 방법>
        = 'String 생성자 함수'를 'new 연산자'없이 호출하는 방법
        = 'Object.prototype.toString' 메서드를 사용하는 방법
        = 문자열 연결 연산자를 이용하는 방법
    -->

    <script>
        // 1. String 생성자 함수를 new 연산자 없이 호출하는 방법 
        //  숫자 -> 문자
        String(1); // '1'
        String(NaN); // 'NaN'
        String(Infinity); // 'Infinity'

        // 블리언 -> 문자
        String(true); // 'true'
        String(false); // 'false'

        // 2. Object.prototype.toString 메서드를 사용하는 방법
        // 숫자 -> 문자
        (1).toString(); // '1'
        (NaN).toString(); // 'NaN'
        (Infinity).toString(); // 'Infinity'

        // 블리언 -> 문자
        (true).toString(); // 'true'
        (false).toString(); // 'false'

        // 3. 문자열 연결 연산자를 이용하는 방법
        // 숫자 -> 문자
        1 + ''; // '1'
        NaN + '' // 'NaN'
        Infinity + '' // 'Infinity'

        // 블리언 -> 문자
        true + '' // 'true'
        false + '' // 'false'
    </script>
    
</body>
</html>
