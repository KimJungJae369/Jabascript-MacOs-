<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불리언 타입으로 변환</title>
</head>
<body>

    <!-- 
        불리언 타입으로 변환
        1. if('') console.log(x);
        = 'if문'이나 'for 문'과 같은 제어문 또는 '삼항 조건 연산자'의 조건식은 불리언 값 즉 논리적 참/거짓으로 평가 되어야 한는 표현식
        = 자바스크립트 엔진은 조건식의 평가 결과를 불리언 타입으로 암묵적 타입 변환한다

        2.  if('') console.log('1');
            if(true) console.log('2');
            if(0) console.log('3');
            if('str') console.log('4');
            if(null) console.log('5');

            // 출력 : 2,4
            = 자바스크립트 엔진은 블리언 타입이 아닌 값을 'Truthy 값(참으로 평가되는 값)' 또는 'Falsy 값(거짓으로 평가되는 값)'으로 구분
            = 즉 제어문의 조건식과 같이 불리언 값으로 평가되어야 할 문맥에서 'Truthy'값은 true로 'Falsy'은 false로 암묵적 타입 변환

            <false로 평가되는 Falsy>
            - false
            - nudefined
            - null
            - 0, -0
            - NaN
            - ''(빈 문자열)

        
        Tip) 함수
        - 함수란 어떤 작업을 수행하는 데 필요한 문들의 집합을 정의한 코드 블록이다
        - 함수는 이름과 매개변수를 가지며 필요할 때 호출해 코드 블록에 담긴 문들을 일괄적으로 실행할 수 있다
    -->

    <script>
        if('') console.log('1');
        if(true) console.log('2');
        if(0) console.log('3');
        if('str') console.log('4');
        if(null) console.log('5');
        // 출력 : 2,4


        if(!false) console.log(false + 'is falsy value');
        if(!undefined) console.log(undefined + 'is falsy value');
        if(!null) console.log(null + 'is falsy value');
        if(!0) console.log(0 + 'is falsy value');
        if(!NaN) console.log(NaN + 'is falsy value');
        if(!'') console.log('' + 'is falsy value');



        // 전달받은 인수가 Falsy 값이면 true, Truthy 값이면 false를 반환
        function isFalsy(v){
            return !v;
        }

        // 전달받은 인수가 Truthy 값이면 true, Falsy 값이면 false를 반환
        function isTruthy(v){
            return !!v;
        }

        // 모두 true를 반환
        isFalsy(false);
        isFalsy(undefined);
        isFalsy(null);
        isFalsy(NaN);
        isFalsy('');


        // 모두 true를 반환
        isTruthy(true);
        isTruthy('0');
        isTruthy({});
        isTruthy([]);
    </script>
    
</body>
</html>
