<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자타입 변환</title>
</head>
<body>

    <!-- 
        숫자 타입 변환
            1 - '1' = 0
            1 * '10' = 10
            1 / 'one' = NaN
        - 산술 연사자의 역할은 숫자 값을 만드는 것
        - 따라서 산술 연산자의 모든 피연산자는 코드 문맥상 숫자 타입이어야 한다
        - 자바스크립트 엔진은 산술 연산자 표현식을 평가하기 위해 산술 연산자의 피연산자 중에서 숫자 타입이 아닌 피연산자를 숫자 타입으로 암묵적 타입 변환
        - 이때 피연산자룰 숫자 타입으로 변환할 수 없는 경우는 산술 연산자을 수행할 수 없으므로 표현식의 평가 결과는 NaN이 된다

        '1' > 0 = true
        - 비교 연산자의 역할은 불리언 값을 만드는 것
        - '>' 비교 연산자는 피연산자의 크기를 비교하므로 모든 피연산자는 코드의 문맥상 모두 숫자 타입이어야 한다
        - '+' 단항 연산자는 피연산자가 숫자 타입의 값이 아니면 숫자 타입의 값으로 암묵적 타입 변환을 수행한다 
            // 문자열 타입
            + '' = 0
            + '0' = 0
            + '1' = 1
            + 'string' = NaN

            // 블리언 타입 
            + true = 1
            + false = 0

            // null 타입
            + null = 0

            // undeifned 타입
            + undeifned = NaN

            // 심벌 타입
            + Symbol() = TypeError

            // 객체 타입
            +{} = NaN
            +[] = 0
            +[10, 20] = NaN
            +(function(){}) = NaN
        - 빈 문자열(''), 빈 배열([]), null, false,는 0으로 true는 1로 변환된다 객체와 빈 배열이 아닌 배열 undefined는 변환되지 않아 NaN이 된다는 것에 주의
    -->
    
</body>
</html>
