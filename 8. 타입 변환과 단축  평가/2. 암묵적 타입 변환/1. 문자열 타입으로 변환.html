<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 타입으로 변환</title>
</head>
<body>

    <!-- 
        암묵적 타입 변환
        = 자바스크립트 엔진은 표현식을 평가할 때 개발자의 의도와는 상관없이 코드의 문맥을 고려해 암묵적으로 데이터 타입을 강제 변환(암묵적 타입 변환)할 때가 있다
            ex)
                '10' + 2 = '102' : 피연산자가 모두 문자열 타입이어야 하는 문맥
                5 * '10' =  50 : 피연산자가 모두 숫자 타입이어야 하는 문맥
                !0 = true / if(1){} : 피연산자 또는 표현식이 블리언 타입이어야 하는 문맥
        = 프로그래밍 언어에 따라 에러를 발생시키기도 하지만 자바스크립트는 가급적 에러를 방생시키지 않도록 암묵적 타입 변환을 통해 표현식을 평가한다

        1. 문자열 타입으로 변환
            ex) 1 + '2' = '12'
        = '+'연산자는 피연산자 중 하나 이상이 문자열이므로 문자열 연결 연산자로 동작
        = 문자열 연결 연산자의 역할은 문자열 값을 만드는 것
        = 따라서 문자열 연결 연산자의 모든 피연산자의 코드의 문맥상 모두 문자열 타입이어야 한다
        = 자바스크립트 엔진은 표현식을 평가할 때 코드 문맥에 부합하도록 암묵적 타입 변환을 실행
            ex) `1 + 1 = ${1 + 1}` = '1 + 1 = 2'

        숫자타입 
        0 + '' = '0'
        -0 + '' = '0'
        1 + '' = '1'
        -1 + '' = '-1'
        NaN + '' = 'NaN'
        Infinity + '' = 'Infinity'
        -Infinity + '' = '-Infinity'

        블리언 타입
        true + '' = 'true'
        false + '' = 'false'

        null 타입
        null + '' = 'null'

        undefined 타입
        undefined + '' = 'undefined'

        심벌 타입
        (Symbol()) + '' = TypeError

        객체 타입
        ({}) + '' = '[object object]'
        Math + '' = '[object Math]'
        [] + '' = ''
        [10,20] + '' = '10' '20'
        (function(){}) + '' = 'function(){}'
        Array + '' = 'function Array(){native code}'
    -->
    
</body>
</html>
