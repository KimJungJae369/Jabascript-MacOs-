<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>null 병합 연산자</title>
</head>
<body>

    <!-- 
        null 병합 연산자
        <1. null 병합 연산자 ??>
        = 좌항의 피연산자가 null 또는 undefined인 경우 우항의 피연산자를 반환하고 그렇지 않으면 좌항의 피연산자를 반환
        = 변수에 기본값을 설정할 때 유용 
        = 'null 병합 연산자 ??'가 도입되기 이전에는 '논리 연산자 ||'를 사용한 단축 평가를 통해 변수에 기본값을 설정

        <2. 논리 연산자 || 단축 평가>
        = 좌항의 피연산자가 'false'로 평가되는 Falsy 값(false, undefined인, null, 0, -0, null, '')이며 우항의 피연산자를 반환 
        = 만약 Falsy값이 0이나 ''도 기본값으로 유효하다면 예기치 않은 동작이 발생
        
        <3. null 병합 연산자 장점>
        = 하지만 'null 병합 연산자 ??'는 좌항의 피연산자가 false로 평가되는 Falsy 값(false, undefined인, null, 0, -0, null, '')이라도 null 또는 undefined가 아니면 좌항의 피연사자를 
        그대로 반환
    -->

    <script>
        // 1. null 병합 연산자
        // 좌항의 피연산자가 null 또는 undefined인 경우 우항의 피연산자를 반환하고 그렇지 않으면 좌항의 피연산자를 반환
        let foo = null ?? 'default string';
        console.log(foo); // default string

        // 2. 논리 연산자 || 단축 평가
        // Falsy값이 0이나 ''도 기본값으로 유효하다면 예기치 않은 동작이 발생
        let foo2 = '' || 'default string';
        console.log(foo2); // default string

        // 3. null 병합 연산자 장점
        // 항의 피연산자가 false로 평가되는 Falsy 값(false, undefined인, null, 0, -0, null, '')이라도 null 또는 undefined가 아니면 좌항의 피연사자를 그대로 반환
        let foo3 = '' ?? 'default string';
        console.log(foo3); // ''
    </script>
    
</body>
</html>
