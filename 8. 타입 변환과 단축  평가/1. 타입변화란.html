<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타입변화란</title>
</head>
<body>

    <!-- 
        타입변화란
        = 값의 타입은 개발자의 의도에 따라 다른 타입으로 변환할 수 있다 
        = 개발자가 의도적으로 값의 타입을 변환하는 것을 '명시적 타입 변환' 또는 '타입 캐스팅'이라 한다
        = 개발자의 의도와는 상관없이 표현식을 평가하는 도중에 자바스크립트 엔진에 의해 암묵적으로 타입이 자동 변환 이를 '암묵적 타입 변환' 또는 '타입 강제 변환'
        = '명시적 타입 변환'이나 '암묵적 타입 변환'이 기존 원시 값을 직접 변경하는 것은 아니다 원시 값은 변경 불가능한 값이므르 변경할 수 없다
        = '타입 변화'이란 기존 원시 값을 사용해 다른 타입의 새로운 원시 값을 생성하는 것
        = 자바스크립트 엔진은 표현식 x + ''을 평가하기 위해 x 변수의 숫자 값을 바탕으로 새로운 문자열 값 '10'을 생성하고 이것으로 표현식 10 + ''를 평가
        = 이때 암묵적으로 생성된 문자열 '10'은 x변수에 재할당되지 않는다
        = 즉 암묵적 타입 변환은 기존 변수 값을 재할당하여 변경하는 것이 아니다
        = 자바스크립트 엔진은 표현식을 에러 없이 평가하기 위해 피연산자의 값을 암묵적 타입 변환해 새로운 타입의 값을 만들어 단 한 번 사용하고 버린다
        = 자신이 작성한 코드에서 암묵적 타입 변환이 발생하는지 발생한다면 어떤 타입의 어떤 값으로 변환되는지 그리고 타입 변환된 값으로 표현식이 어떻게 평가될 것인지 예측 가능해야 한다
        만약 타입 변환 결과를 예측하지 못하거나 예측이 결과와 일치하지 않는다면 오류를 생산할 가능성이 높아진다
        = 자바스크립트 문법을 잘 이해하고 있는 개발자에게 (10).toString()보다 10 + ''이 더욱 간결하고 이해하기 쉽다 
        = 중요한 것은 코드를 예측할 수 있어야 한다는 것
    -->

    <script>
        // 명시적 타입 변환
        var x = 10;
        // 숫자 -> 문자열 타입 교체
        var str = x.toString();
        console.log(typeof str, str);

        console.log(typeof x, x);


        // 암묵적 타입 변환
        var x = 10;
        // 문자열 연결 연산자는 숫자 타입의 x의 값을 바탕으로 새로운 문자열로 반환
        var str = x + '';
        console.log(typeof str, str);

        console.log(typeof x, x);
    </script>
    
</body>
</html>
