<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        리터럴 : 값 자체를 의미하는 표현식
        표현식 : 하나의 값(숫자, 문자열 등)으로 평가되는 문장
        - 삼항 연산자는 표현식입니다. 조건에 따라 다른 문자열을 생성하여 message 변수에 할당합니다
        - 표현식이 아닌 문 : 조건문은 값으로 평가되지 않으므로 표현식이 아닌 문입니다
        세미클론 : 문장의 끝을 나타내는 구분자 / 세미클론이 없으면 자바스크립트는 줄바꿈을 무시하고 이어서 읽기 때문에 오류가 발생할 수 있습니다
        표현식문과 아닌 문 : 표현식문은 하나의 값으로 평가되는 문장 표현식이 아닌 문은 하나의 값으로 평가되지 않는 문장입니다

        표현식 문 
        = 값이 나오면 '표현식' 만약 그 값을 단독으로 사용하면 '표현식문'이 된다
        표현식 문의 단독 ex) 10 + 10; // 표현식문
        = 표현식문은 세미콜론으로 끝납니다 
    -->

    <script>
        /*
            1. 음료 가격 3000 을 리터럴로 사용하기
            2. 수량 2 를 리터럴로 사용하기
            3. 두 값을 곱해서 총 금액을 저장하는 표현식을 만들기
            4. console.log() 로 총 금액 출력하기
            5. 코드 안에서:
                * 표현식인 문 1개
                * 표현식이 아닌 문 1개
                    를 포함하기
            6. 세미콜론(;)도 정확히 작성하기
        */

            // let drinkPrice = 3000; 

            // let result; // 표현식이 아닌 문

            // result = drinkPrice * 2; // 표현식 문

            // // 리터럴 : 3000,2
            // console.log(result);

            let drinkPrice = 3000;
            let result;
            result  = drinkPrice * 2;
            console.log(result);
    </script>
    
</body>
</html>
