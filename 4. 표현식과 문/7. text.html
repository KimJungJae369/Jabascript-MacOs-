<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        리터럴 : 값 자체를 의미하는 표현식
        표현식 : 하나의 값(숫자, 문자열 등)으로 평가되는 문장
        - 삼항 연산자는 표현식입니다. 조건에 따라 다른 문자열을 생성하여 message 변수에 할당합니다
        - 표현식이 아닌 문 : 조건문은 값으로 평가되지 않으므로 표현식이 아닌 문입니다
        세미클론 : 문장의 끝을 나타내는 구분자 / 세미클론이 없으면 자바스크립트는 줄바꿈을 무시하고 이어서 읽기 때문에 오류가 발생할 수 있습니다
        표현식문과 아닌 문 : 표현식문은 하나의 값으로 평가되는 문장 표현식이 아닌 문은 하나의 값으로 평가되지 않는 문장입니다

        표현식 문 
        = 값이 나오면 '표현식' 만약 그 값을 단독으로 사용하면 '표현식문'이 된다
        표현식 문의 단독 ex) 10 + 10; // 표현식문
        = 표현식문은 세미콜론으로 끝납니다 
    -->

    <script>
        /*
            * 상품명: "맥북 프로"
            * 가격: 2500000
            * 수량: 2
            * 할인율: 10

            그리고 다음을 구현해봐.

            1. 각각의 값을 변수에 저장한다.
            2. 가격 × 수량을 계산해서 totalPrice 변수에 저장한다.
            3. 전체 금액에서 10%를 할인한 금액을 finalPrice 변수에 저장한다.
            4. console.log()를 사용해서 상품명과 최종 가격을 출력한다.
        */

            const productName = '맥북 프로';
            // ↑ 전체는 문
            // '맥북 프로'는 표현식

            const price = 2500000;
            // ↑ 전체는 문
            // 2500000은 표현식

            const stock = 2;
            // ↑ 전체는 문
            // 2는 표현식

            const discount = 10;
            // ↑ 전체는 문
            // 10은 표현식

            const totalPrice = price * stock;
            // ↑ 전체는 문
            // price * stock은 표현식

            const finalPrice = totalPrice - (totalPrice * discount / 100);
            // ↑ 전체는 문
            // totalPrice - (...) 부분은 표현식

            console.log(productName);
            // ↑ 표현식 문
    </script>
    
</body>
</html>
