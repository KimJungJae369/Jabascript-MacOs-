<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        리터럴 : 값 자체를 의미하는 표현식
        표현식 : 하나의 값(숫자, 문자열 등)으로 평가되는 문장
        - 삼항 연산자는 표현식입니다. 조건에 따라 다른 문자열을 생성하여 message 변수에 할당합니다
        - 표현식이 아닌 문 : 조건문은 값으로 평가되지 않으므로 표현식이 아닌 문입니다
        세미클론 : 문장의 끝을 나타내는 구분자 / 세미클론이 없으면 자바스크립트는 줄바꿈을 무시하고 이어서 읽기 때문에 오류가 발생할 수 있습니다
        표현식문과 아닌 문 : 표현식문은 하나의 값으로 평가되는 문장 표현식이 아닌 문은 하나의 값으로 평가되지 않는 문장입니다

        표현식 문 
        = 값이 나오면 '표현식' 만약 그 값을 단독으로 사용하면 '표현식문'이 된다
        표현식 문의 단독 ex) 10 + 10; // 표현식문
        = 표현식문은 세미콜론으로 끝납니다 
    -->

    <script>
        /*
            1. 숫자 리터럴 10과 20을 사용해서 sum이라는 변수에 두 값을 더한 결과를 저장한다.
            2. console.log(sum);으로 결과를 출력한다.
            3. 코드 안에 표현식인 문을 2개 작성한다.
            4. 코드 안에 표현식이 아닌 문을 1개 작성한다.
            5. 모든 문 끝에 **세미콜론(;)**을 붙인다.
        */

        let sum = 10 + 20; // 표현식이 아닌 문
        console.log(sum);  // 표현식인 문
        10 + 20; // 표현식인 문
        sumn = 30; // 표현식인 문
        
    </script>
    
</body>
</html>
