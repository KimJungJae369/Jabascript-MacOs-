<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연산자 우선순위, 결합순서</title>
</head>
<body>

    <!-- 
        <연산자 우선순위>
        = 여러 개의 연산자로 문이 실행될 때 연산자가 실행되는 순서
        = 연산자는 종류가 많아서 연산자 우선순위를 모두 기억하기 어렵고 실수하기도 쉽다
        = 기억에 의존하기보다 연산자 우선순위가 가장 높은 그룹 연산자를 사용하여 우선순위를 명시적으로 조절하는 것이 좋다
        순위
        1. () : 그룹 연산자
        2. new(매개변수 존재), [](프로퍼티 접근), (함수호출), ?.(옵션널 체이닝 연산자)
        3. new(매개변수 존재 X)
        4. x++, x-- : 후위 증가/감소 연산자
        5. ++x, --x : 전위 증가/감소 연산자, typeof, delete, void : 단항 연산자
        6. ** : 지수 연산자(이항 연산자 중에서 우선순위가 가장 높음)
        7. *, /, % : 산술 연산자
        8. +, - : 산술 연산자
        9. <, <=, >, >=, in, instanceof : 비교 연산자
        10. ==, !=, ===, !== : 동등 비교 연산자
        11. ?? : null 병합 연산자
        12. && : 논리 AND 연산자
        13. || : 논리 OR 연산자
        14. ? ... : ... : 삼항 조건 연산자
        15. =, +=, -=, *=, /=, %=, **= : 할당 연산자
        16. yield : 제너레이터 함수의 실행을 일시 중지하고 재개하는 연산자
        17. , : 쉼표 연산자

        <연산자 결합순서>
        = 연산자의 어느 쪽(좌항 또는 우항)부터 평가를 수행할 것인지를 나타내는 순서를 말한다
        = 대부분의 연산자는 좌항에서 우항으로 평가하는 '좌측 결합'을 따른다
        = 하지만 일부 연산자는 우항에서 좌항으로 평가하는 '우측 결합'을 따른다
        = 우측 결합 연산자는 '할당 연산자(=)', '삼항 조건 연산자(?:)', 'yield' 등이 있다
    -->
    

    <script>
        // 연산자 우선순위
        var x = 1 + 2 * 3;
        console.log(x); // 7
        
        // 연산자 결합순서
        var y = 1, z = 2;
        y = z = 3; // 할당 연산자는 우측 결합이므로 z에 3이 할당된 후 y에 z의 값이 할당된다 
        console.log(y); // 3
        console.log(z); // 3
    </script>
</body>
</html>
