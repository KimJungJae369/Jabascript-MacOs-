<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산술 연산자</title>
</head>
<body>

    <!-- 
        산술 연산자
        = '피연산자'를 대상으로 수학적 계산을 수행해 새로운 숫자 값을 만든다
        = '산술 연산자'의 불가능한 경우 'NaN'을 반환
        = 산술 연산자는 피연산자의 개수에 따라 '이항 산술 연산자'와 '단항 산술 연산자'로 구분 

        1. 이항 산술 연산자
        = 2개의 피연산자를 '산술 연산자'와 연산하여 숫자 값을 만든다
        = 피연산자의 값을 변경하는 '부수 효과(외부에 영향을 준다/ 하던 일을 하다가 다른일도 같이 하는 것)'가 없다
        = 다시 말해 어떤 산술 연산을 해도 피연산자의 바뀌는 경우는 없고 언제나 새로운 값을 만든다
            ex)
                5 + 2 // 7
                5 - 2 // 3
                5 * 2 // 10
                5 / 2 // 2.5
                5 % 2 // 1
                5 ** 2 // 25

        2. 단항 산술 연산자 
        = 1개의 피연산자를 산수 연산하여 숫자 값을 만든다
        = 증가/감소(++ / --)연산자는 피연산자의 값을 변경하는 '부수 효과'가 있다
        = 다시 말해 증가/감소 연산을 하면 피연산자의 값을 변경하는 암묵적 할당이 이뤄진다
        = 숫자 타입이 아닌 피연산자 '+ 단항 연산자'를 사용하면 피연산자를 숫자 타입으로 변환하여 반환
        = 이때 피연산자를 변경하는 것이 아니고 숫자 타입으로 변환한 값을 생성해서 반환
        = 따라서 부수 효과는 없다
        = '-' 단항 연산자는 피연산자의 부호를 반전한 값을 반환
        = '+' 단항 연산자와 마찬가지로 숫자 타입이 아닌 피연산자에 사용하면 피연산자를 숫자 타입으로 변환하여 반환
        = 이때 피연산자의 변경하는 것은 아니고 부호를 반전한 값을 생성하여 부수 효과는 없다

        <증가/감소 연산자는 위치에 의미>
        1. 전위 연산자 : 피연산자 앞에 위치하고 피연산자를 증가/감소를 시키고 출력한다
            ex)
                var x = 5;

                resulyt = ++x
                consol,log(result, x) // 5 6

                result = --x;
                cosnol.loeg(result, x) // 5 4

        2. 후위 연산자 : 피연산자 뒤에 위치하고 피연산자를 출력하고 난 후에 증가/감소를 시킨다
            ex)
                var x = 5;

                resulyt = x++
                consol,log(result, x) // 5 5
                
                resulyt = x--
                consol,log(result, x) // 5 4

        3. 문자열 연결 연산자
        = '+'연산자는 피연산자 중 하나 이상이 문자열인 경우 문자열 연결 연산자로 동작
        = 그 외의 경우는 산술 연산자로 동작
            ex)
                '1' + 2 // '12'
                1 + '2' // '12'
                '1' + '2' // '12'
                1 + 2 // 3

        = 개발자의 의도와는 상관없이 자바스크립트 엔진에 의해 암묵적으로 타입이 자동 변환되기도 한다
        = 1 + turn를 연산하면 자바스크립 엔진은 암묵적으로 '블러언 타입' 값인 true를 숫자 타입인 1로 타입을 강제로 변환한 후 연산을 수행
        = 이를 '암묵적 타입 변화' 또는 '타입 강제 변화'라고 한다
    -->
    
</body>
</html>
