<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그룹 선택자</title>
</head>
<body>

    <!-- 
        그룹 선택자
        = 소괄호('()')로 연산자를 감싸는 그룹 연산자는 자신의 피연산자인 표현식을 가장 먼저 평가
        = 따라서 그룹 연산자를 사용하면 연산자의 우선순위를 조절할 수 있다
        = 그룹 연산자는 연산자 우선순위가 가장 높다 
            ex)
                10 * 2 + 3 = 23
                10 * (2 + 3) = 50
    -->
</body>
</html>
