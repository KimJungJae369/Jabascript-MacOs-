<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        연산자 우선순위 : () 그룹 연산자가 가장 먼저 계산된다
        부수 효과 : 변수의 값이나 프로그램 상태를 변경하는 효과이다
    -->

    <script>
        /*
            1. price에 10000, discount에 2000을 저장한다.
            2. 산술 연산자를 사용하여 할인된 금액을 finalPrice에 저장한다.
            3. 할당 연산자(+=)를 사용하여 point를 0에서 100으로 만든다.
            4. 비교 연산자를 사용하여 finalPrice가 8000과 같은지 확인하고 console.log()로 출력한다.
            5. 삼항 연산자를 사용하여 finalPrice가 5000 이상이면 "구매 가능", 아니면 "구매 불가"를 출력한다.
            6. 논리 연산자(&&)를 사용하여 isLogin = true, isAdult = true일 때만 true가 출력되도록 한다.
            7. typeof 연산자를 사용하여 finalPrice의 타입을 출력한다.
            8. 지수 연산자(**)를 사용하여 2의 5제곱을 출력한다.
            9. 그룹 연산자(())를 사용하여 (10 + 5) * 2를 계산해 출력한다.
            10. 쉼표 연산자를 사용하여 변수 a, b, c에 각각 1, 2, 3을 순서대로 할당한 뒤, 마지막 결과를 출력한다.
        */

        let price = 10000;
        let discount = 2000;

        let finalPrice = price - discount;

        let point = 0;
        point += 100;
        console.log(finalPrice === 8000);
        console.log(finalPrice >= 50000 ? '구매 가능' : '구매 불가');

        let isLogin = true;
        let isAdult = true;
        console.log(isLogin && isAdult);

        console.log(typeof finalPrice);
        
        console.log(2 ** 5);

        console.log((10 + 5) * 2);

        let a, b, c;
        console.log(a = 1, b = 2, c = 3);
    </script>
    
    
</body>
</html>
