<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        연산자 우선순위 : () 그룹 연산자가 가장 먼저 계산된다
        부수 효과 : 변수의 값이나 프로그램 상태를 변경하는 효과이다
    -->

    <script>
        /*
            * 상품 가격: 30000
            * 구매 수량: 3
            * 할인 금액: 10000

            그리고 연산자를 이용해서 다음 값을 각각 구해봐.

            1. 총 상품 금액 → price * quantity
            2. 할인 적용 금액 → 총 상품 금액에서 할인 금액을 뺀 값
            3. 상품 가격이 3만원 이상인지 → 비교 연산자 사용
            4. 수량이 0인지 아닌지 → 비교 연산자 사용
            5. price와 quantity가 둘 다 숫자인지 확인 → && 사용
            6. price가 30000이거나 quantity가 3인지 확인 → || 사용
        */

        const price = 3000;
        const quantity = 3;

        const amount = price * quantity;

        const result = amount - (amount * 10 / 100);

        const comparison = quantity === 0;

        const result2 = quantity !== 0;

        const type = typeof price === 'number' && typeof quantity === 'number';

        const resultNum = price === 30000 || quantity === 3;

        console.log(
            price,
            quantity,
            amount,
            result,
            comparison,
            result2,
            type,
            resultNum
        );
    </script>
    
    
</body>
</html>
