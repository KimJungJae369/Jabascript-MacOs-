<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        연산자 우선순위 : () 그룹 연산자가 가장 먼저 계산된다
        부수 효과 : 변수의 값이나 프로그램 상태를 변경하는 효과이다
    -->

    <script>
        /*
            1. num1에 10, num2에 5를 저장한다.
            2. 산술 연산자를 사용해 두 수를 더한 결과를 result에 저장한다.
            3. 할당 연산자(+=)를 사용해 result에 5를 더한다.
            4. 비교 연산자를 사용해 result가 20과 같은지 출력한다.
            5. 삼항 연산자를 사용해 result가 20 이상이면 "합격", 아니면 "불합격"을 출력한다.
            6. 논리 연산자(&&)를 사용해 result가 20 이상이고 30 이하인지 출력한다.
            7. typeof 연산자를 사용해 result의 타입을 출력한다.
        */

        let num1 = 10
        let num2 = 5;
        let result = num1 + num2;
        result += 5;
        console.log(result === 20);

        console.log(result == 20 ? '합격' : '불합격');
        console.log(result >= 20 && result <= 30);
        console.log(typeof result);
    </script>
    
    
</body>
</html>
