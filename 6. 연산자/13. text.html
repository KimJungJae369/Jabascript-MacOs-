<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <script>
        /*
            🎯 요구사항
            1. price를 숫자로 변환 후 할인 적용
                👉 할인 가격 = price - (price * discount)
            2. 회원이면 추가로 100원 할인 (논리 연산자 활용)
            3. 포인트가 있으면 포인트 차감 (할당 연산자 활용)
            4. 최종 가격이 0보다 작으면 0으로 처리 (삼항 연산자)
            5. typeof로 최종 결과 타입 확인
            6. 괄호를 사용해서 연산자 우선순위를 명확히 할 것
            7. 아래 코드의 실행 결과를 예측하고 이유 설명 (부수효과 + 쉼표 연산자)
        */

        let price = "1000";  
        let discount = 0.2;
        let isMember = true;
        let point = 100;

        let finalPrice = Number(price) - (Number(price) * discount);

        finalPrice -= isMember && 100; // isMember가 true이므로 100이 차감됨
        finalPrice -= point;

        finalPrice = finalPrice < 0 ? 0 : finalPrice;

        console.log(`최종 가격: ${finalPrice}`);
        console.log(`타입: ${typeof finalPrice}`);
        console.log((finalPrice, typeof finalPrice));
    </script>
    
    
</body>
</html>
