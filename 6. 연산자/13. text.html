<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <script>
        /*
            1. 산술 연산자(+, -, *, / 중 하나 이상) 사용하기
            2. 할당 연산자(=, += 등) 사용하기
            3. 비교 연산자(>, === 등) 사용하기
            4. 삼항 연산자 사용하기
            5. 논리 연산자(&&, ||, !) 사용하기
            6. typeof 연산자 사용하기
            7. 지수 연산자(**) 사용하기
            8. 그룹 연산자(()) 사용해서 우선순위 바꾸기
            9. 쉼표 연산자(,) 사용하기
            10. 부수 효과가 발생하는 코드 1개 작성하기
            11. 마지막 주석으로:

            * 연산자 우선순위
            * 부수 효과
                를 한 줄씩 설명하기
        */

        let num = 10 + 5; // 산술 연산자

        num += 5; // 할당 연산자 (부수 효과 발생)

        let compare = num >= 10; // 비교 연산자

        let result = num % 2 === 0 ? '짝수' : '홀수'; // 삼항 연산자

        let logic = true && true; // 논리 연산자

        console.log(typeof num); // typeof 연산자

        let power = 2 ** 3; // 지수 연산자

        let group = (5 + 3) * 2; // 그룹 연산자

        let x, y, z;
        x = 1, y = 2, z = 3; // 쉼표 연산자

        console.log(compare);
        console.log(result);
        console.log(logic);
        console.log(power);
        console.log(group);

        // 연산자 우선순위 : () 그룹 연산자가 가장 먼저 계산된다
        // 부수 효과 : 변수의 값이나 프로그램 상태를 변경하는 효과이다
    </script>
    
    
</body>
</html>
