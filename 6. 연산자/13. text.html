<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <script>
        let a = 2;
        let b = 3;

        // 쉼표 연산자 + 지수 + 그룹 + 산술 + 할당 + 부수효과
        let result = (a += 1, b ** 2); 
        console.log(result); // 9
            // a += 1 👉 부수효과 (a 값이 바뀜)
            // * , 👉 쉼표 연산자는 마지막 값 반환
            // * 그래서 👉 b ** 2 = 9가 result에 들어감
            // 지수 연산자는 부수효과가 없다

        // 논리 + 비교
        let logic = (a > 2) && (b === 3);
        console.log(logic); // true

        // typeof
        console.log(typeof result); // number

        // 삼항 연산자
        let check = result > 5 ? "pass" : "fail";
        console.log(check); // pass
    </script>
    
    
</body>
</html>
