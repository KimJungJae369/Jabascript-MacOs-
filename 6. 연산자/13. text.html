<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <script>
        /*
            1. 산술 연산자 사용 (+, -, *, /, % 중 하나 이상)
            2. 할당 연산자 사용 (=, += 등)
            3. 비교 연산자 사용 (>, === 등)
            4. 삼항 연산자 사용 (조건 ? 값1 : 값2)
            5. 논리 연산자 사용 (&&, ||, !)
            6. typeof 연산자 사용
            7. 지수 연산자(**) 사용
            8. 괄호 () 를 사용해서 우선순위를 바꿀 것
            9. 부수 효과(side effect)가 발생하는 연산 포함
                * 예: ++, --, =
            10. 쉼표 연산자 , 를 1번 이상 사용할 것
        */

        let num = 10 + 20;
        console.log(num);

        // 할당 연산자
        let num2 = 10;

        num2 += 5;
        num2 -= 3;

        console.log(num2);

        // 비교 연산자
        let a = 10;
        let b = 5;

        console.log(a > b);

        // 삼항 연산자
        let x = 4;

        let result = x % 2 === 0 ? '짝수' : '홀수';

        console.log(result);

        // 논리 연산자
        let isStudent = true;
        let hasBook = false;

        console.log(isStudent && hasBook);

        // typeof 연산자
        console.log(typeof result);

        // 지수 연산자
        let power = 2 ** 3;

        console.log(power);

        // 괄호로 우선순위 변경
        let priority = (10 + 5) * 2;

        console.log(priority);

        // 부수 효과
        power++;
        console.log('부수효과 : ',power);
        ++power
        console.log('부수효과 : ',power);

        // 쉼표 연산자
        let test = (1 + 2, 3 + 4);

        console.log(test);
    </script>
    
    
</body>
</html>
