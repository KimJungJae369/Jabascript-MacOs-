<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <script>
        let isMember = false;
        let totalPrice = 30000;
        let coupon = "DISCOUNT";

        // ✅ 핵심: 조건 판단 (연산자 사용)
        let isDiscount = isMember === true || totalPrice <= 50000 || coupon !== null;
        // isMember가 true이거나, totalPrice가 50000 이하이거나, coupon이 null이 아니면 할인 적용

        // 출력
        console.log(`할인 적용 여부: ${isDiscount}`);

        // 추가 미션
        if (isDiscount) {
            console.log("할인 적용됨");
        } else {
            console.log("할인 없음");
        }
    </script>
    
    
</body>
</html>
