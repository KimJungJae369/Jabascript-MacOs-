<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        연산자 우선순위 : () 그룹 연산자가 가장 먼저 계산된다
        부수 효과 : 변수의 값이나 프로그램 상태를 변경하는 효과이다
    -->

    <script>
        /*
            1. 상품 가격 변수 만들기
            2. 수량 변수 만들기
            3. 산술 연산자(+, *, - 등)를 사용해서 총 가격 계산하기
            4. 할당 연산자(+= 또는 -= 등) 1번 이상 사용하기
            5. 비교 연산자(>, === 등) 사용하기
            6. 삼항 연산자를 사용해서:
                * 총 금액이 10000원 이상이면 "할인 대상"
                * 아니면 "일반 고객"
            7. 논리 연산자(&&, ||, !) 1개 이상 사용하기
            8. typeof 연산자로 변수 타입 출력하기
            9. 지수 연산자(**) 사용하기
            10. 그룹 연산자 () 사용해서 우선순위 바꾸기
            11. 쉼표 연산자 , 1번 사용하기
            12. 부수 효과가 발생하는 코드 1개 포함하기
                (예: count++, price += 1000)
        */

        let price = 3000;
        let count = 2;

        // 산술 연산자 + 그룹 연산자
        let total = (price * count) + 1000;

        // 할당 연산자
        total += 500;

        // 비교 연산자
        let isOver = total >= 10000;

        // 삼항 연산자
        let customer =
            total >= 10000 ? '할인 대상' : '일반 고객';

        console.log(customer);

        // 논리 연산자
        let check = total > 5000 && count >= 2;

        console.log(check);

        // typeof 연산자
        console.log(typeof total);

        // 지수 연산자
        let power = 2 ** 3;

        console.log(power);

        // 쉼표 연산자
        let comma = (price += 100, count += 1);

        console.log(comma);

        // 부수 효과 발생
        count++;

        console.log(count);
    </script>
    
    
</body>
</html>
