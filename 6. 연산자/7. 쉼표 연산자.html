<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쉼표 연산자</title>
</head>
<body>

    <!-- 
        쉼표(,) 연산자
        = 왼쪽 피연산자부터 차례대로 피연산자를 평가하고 마지막 피연산자의 평가가 끝나면 마지막 피연산자의 평가 결과를 반환
    -->

    <script>
        var x,y,z;
        x = 1; y = 2; z = 3;
        var result = (x += 10, y += 20, z += 30);
        console.log(result); // 33
    </script>
    
</body>
</html>
