<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>논리 연산자</title>
</head>
<body>

    <!-- 
        논리 연산자 
        = 우항과 좌항의 피연산자(부정 논리 연산자의 경우 우항의 피연산자)를 논리 연산한다
            || : 논리 합(OR) 연산자    
            && : 논리 곱(AND) 연산자
            !  : 부정(NOT) 연산자
        
        = 논리 부정(!) 연산자는 언제나 블리언 값을 반환
        = 단 피연산자가 반드시 블리언 값일 필요는 없다 
        = 만약 피연산자가 블리언 값이 아니면 블리언 타입으로 암묵적 타입 변화
        = 논리합(||) 또는 논리곱(&&) 연산자 표현식의 평가 결과는 블리언 값이 아닐 수 있다
        = 논리합(||) 또는 논리곱(&&) 연산자 표현식은 언제나 2개의 피연산자 중 어느 한족으로 평가


        Tip) 드 모르간 법칙
        = 논리 연산자로 구성된 복잡한 표현식은 가독성이 좋지 않아 한눈에 이해하기 어려울 때가 있다 이러한 경우 '드 모르간 법칙'을 활용하여 복잡한 표현식을 단순화할 수 있다
            !(x || y) === (!x && !y);
            !(x && y) === (!x || !y);
    -->

    <script>
        // 논리합(||) 연산자
        true || true // true
        true || false // true
        false || true // true
        false || false // false

        // 논리곱(&&) 연산자
        true && true // true
        true && false // false
        false && true // false
        false && false // false

        // 논리 부정(!) 연산자
        !true // false
        !false // true

        // 암묵적 타입 변환
        !0; // true
        !'Hello' // false

        // 단축평가
        'Cat' && 'Dog'; // 'Dog'
        'Cat' || 'Dog'; // 'Cat'

        // 드 모르간 법칙
        var x = 2, y = 3;
        console.log(!(x > 0 || y > 0)); // false
        console.log((!(x > 0) && !(y > 0))); // false
    </script>
    
</body>
</html>
