<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typeof 연산자</title>
</head>
<body>

    <!-- 
        typeof 연산자
        = 피연산자의 데이터 타입을 문자열로 반환
        = 'typeof' 연산자는 7가지 문자열중 하나를 반환한다
            1. 'undefined' : undefined
            2. 'boolean' : true, false
            3. 'number' : 숫자
            4. 'string' : 문자열
            5. 'object' : 객체, null
            6. 'function' : 함수
            7. 'symbol' : 심벌(ES6에서 추가된 데이터 타입)

        = 'null'을 반환하는 경우는 없으며 함수의 경우 'function'을 반환한다
        = 'typeof' 연산자가 반환하는 문자열 을 7개의 데이터 타입과 정확히 일치하지는 않는다
        = 'typeof' 연산자로 'null' 값을 연산해 보면 'null'이 아닌 'object'가 반환된다
        = 이것은 자바스크립트의 첫 번째 버전의 버그
        = 하지만 기존 코드에 영향을 줄 수 있기 때문에 아직까지 수정되지 못했다
        = 따라서 'null' 타입인지 확인할 떄는 'typeof' 연산자를 사용하지 말고 일치 연산자(===)를 사용
        = 선언하지 않은 식별자를 'typeof' 연산자로 연산하면 'undefined'가 반환된다
    -->
    
    <script>
        // typeof 연산자 
        console.log(typeof undefined); // 'undefined'
        console.log(typeof true); // 'boolean'
        console.log(typeof 123); // 'number'
        console.log(typeof ''); // 'string'
        console.log(typeof {}); // 'object'
        console.log(typeof null); // 'object' (null은 객체로 취급)
        console.log(typeof function(){}); // 'function'
        console.log(typeof Symbol('symbol')); // 'symbol'

        // null 타입인지 확인할 때는 typeof 연산자를 사용하지 말고 일치 연산자(===)를 사용
        var foo = null;
        typeof foo === null; // false
        foo === null; // true


        // 선언하지 않은 식별자를 typeof 연산자로 연산하면 'undefined'가 반환된다
        console.log(typeof undeclaredVariable); // 'undefined'
    </script>
</body>
</html>
