<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼항 조건 연산자</title>
</head>
<body>

    <!-- 
        삼항 조건 연산자
        = 조건식의 평가 경과에 따라 반환할 값을 결정
        = 자바스크립트의 유일한 삼항 연산자이며 부수 효과는 없다
            ex) 조건식 ? 조건식이 true일 때 반환 : 조건식이 false일 때 반환

        = 첫 번째 피연산자가 true로 평가되면 두 번째 피연산자를 반환
        = 첫 번째 피연산자가 false로 평가되면 세 번째 피연산자를 반환
        = 즉 삼항 조건 연산자는 두 번째 피연산자 또는 세 번째 피연산자로 평가된다
        = 물음표(?) 앞의 첫 번째 피연산자는 조건식 즉 블리언 타입의 값으로 평가될 표현식

        < if ~ else문과 삼항 조건 연산자 차이 >
        = 삼항 조건 연산자는 표현식은 값처럼 사용 가능
        = if ~ else 문은 값처럼 사용할 수 없다
        = 삼항 조건 연산자 표현식은 값으로 평가할 수 있는 표현식인 문
        = 삼항 조건 연산자 표현식은 값처럼 다른 표현식의 일부가 될 수 있어 매우 유용
            ex)
                var result = (x % 2) ? 'x는 홀수' : 'x는 짝수';
                console.log(result);  // x는 짝수
    -->


    <script>
        var x = 5;
        var result = (x % 2) ? 'x는 홀수' : 'x는 짝수';
        console.log(result);  // x는 짝수
    </script>
    
</body>
</html>
