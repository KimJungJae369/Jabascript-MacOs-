<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비교 연산자</title>
</head>
<body>

    <!-- 
        <비교 연산자>
        = 좌항과 우항의 피연산자를 비교한 다음 그 결과를 '블리언 값'으로 반환하는 연산자
        = 'if문'이나 'for문'과 같은 제어문의 조건식에 주로 사용

        <동등/일치 비교 연산자>
        = '동등 연산자'는 느슨한 비교를 하지만 '일치 비교 연산자'는 엄격한 비교를 한다
            ex)
                == : 동등 연산자 / != : 부동등 연산자
                === : 일치 연산자 / !== : 불일치 연산자
        = 문자열 연산자는 개발자의 의도와는 상관없이 자바스크립트 엔진에 의해 암묵적으로 타입을 자동 변환(암묵적 변환)

        1. 동등 비교 연산자(==)
        = '동등 비교(==) 연산자'는 좌항과 우항의 피연산자를 비교할 때 먼저 암묵적으로 타입 변환을 통해 타입을 일치시킨 후 같은 값이지 비교
        = 따라서 '동등 비교 연산자'는 좌항과 우항의 피연산자가 타입은 다르더라도 암묵적 타입 변환 후에 같은 값일 수 있다면 'true'를 반환  
            ex)
                5 == '5'  // true
                0 == false  // true
                '' == false  // true
                null == undefined  // true
        = 편리한 경우도 있지만 결과를 예측하기 어렵고 실수하기 쉬워 사용하지 않는 편이 좋다 대신 '일치 비교 연산자'를 사용할 것이 좋다

        2. 일치 비교 연산자(===)
        = 좌항과 우항의 피연산자가 타입도 같고 값도 같은 경우 한해서 'true'를 반환
        = 암묵적으로 타입 변환을 하지 않고 값을 비교
        = 예측하기가 쉽다
            ex)
                5 === '5'  // false
                0 === false  // false
                '' === false  // false
                null === undefined  // false

        3. NaN
        = 'NaN'은  자기자신과 일치하지 않는 유일한 값
        = 따라서 숫자가 NaN인지 조사하려면 빌트인 함수 'Number.isNaN'을 사용해야 한다
            Number.isNaN : 지정한 값이 NaN인지 확인하고 그 결과를 블리언 값으로 반환
            isNaN : 지정한 값이 NaN인지 확인하기 전에 암묵적 타입 변환을 통해 숫자로 변환한 후 NaN인지 확인
            ex)
                NaN === NaN  // false
                Number.isNaN(NaN)  // true
        = 자바스크립트에는 '+0'와 '-0'가 있는데 이들을 비교하면 'true'를 반환
            ex)
                +0 === -0  // true
                object.is : 예측 가능한 정확한 비교 결과를 반환
                    ex)
                        object.is(+0, -0)  // false
                        object.is(NaN, NaN)  // true

        4. 부동등 비교 연산자(!=)와 불일치 비교 연산자(!==)                   
        = 부동등 비교 연산자(!=)는 동등 비교 연산자(==)의 반대 개념으로 암묵적 타입 변환을 통해 타입을 일치시킨 후 다른 값인지 비교 다른 값이라면 'true'를 반환
        = 불일치 비교 연산자(!==)는 일치 비교 연산자(===)의 반대 개념으로 타입이 다르거나 값이 다른 경우 'true'를 반환
            ex)
                5 != '5'  // false
                5 !== '5'  // true  
                

        <대소 관계 비교 연산자>
        = 대소 관계 비교 연산자는 피연산자의 크기를 비교하여 '블리언 값'을 반환
            ex)
                >  : 초과(보다 큼)
                >= : 이상(크거나 같음)
                <  : 미만(보다 작음)
                <= : 이하(작거나 같음)
        = 대소 관계 비교 연산자는 피연산자의 타입이 '숫자'가 아니면 암묵적 타입 변환을 통해 '숫자' 타입으로 변환한 후 비교
            ex)
                5 > '3'  // true
                '5' >= 5  // true           
    -->
    
</body>
</html>
