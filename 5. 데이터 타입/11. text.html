<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        isNaN : 값이 NaN인지 판별하는 함수
        - NaN : Not a Number의 약자로 숫자가 아님을 나타내는 특별한 값

        데이터 타입이 필요한 이유 : 데이터 타입은 값을 저장하고 참조할 때 메모리를 효율적으로 사용하기 위해 필요하다
        동적 타이핑 : 자바스크립트는 변수 타입이 고정되지 않고 값에 따라 타입이 동적으로 변경된다

            undefined: 변수는 존재하지만 값이 자동으로 할당되지 않은 상태
            null: 개발자가 의도적으로 ‘값이 없음’을 나타내기 위해 넣은 값
    -->

    <script>
        /*
            상품명    → "아이폰 17"
            가격      → 1590000
            재고 있음 → true
            할인율    → 15.5
            상품 설명 → "최신 스마트폰입니다."
            배송비    → 3000
        */

        
        
        const productName = "아이폰 17";   
        console.log(typeof productName);  

        const price = 1590000;   
        console.log(typeof price);         

        const isInStock = true;    
        console.log(typeof isInStock);       

        const discountRate = 15.5;     
        console.log(typeof discountRate);        

        const productDescription = "최신 스마트폰입니다.";
        console.log(typeof productDescription);

        const shippingFee = 3000;
        console.log(typeof shippingFee);
    </script>
    
</body>
</html>
