    <!-- 
        isNaN : 값이 NaN인지 판별하는 함수
        - NaN : Not a Number의 약자로 숫자가 아님을 나타내는 특별한 값
    -->

    <script>
        /*
            1. 숫자 데이터 타입 변수 1개 만들기
            2. 문자열 데이터 타입 변수 1개 만들기
            3. 템플릿 리터럴(` `)을 사용해서 문자열 출력하기
            4. 불리언(Boolean) 변수 1개 만들기
            5. undefined 상태인 변수 1개 만들기
            6. null 값을 가진 변수 1개 만들기
            7. Symbol()을 사용한 변수 1개 만들기
            8. 객체(Object) 변수 1개 만들기
            9. typeof를 사용해서 데이터 타입을 3개 이상 출력하기
            10. 마지막 주석으로:

            * 데이터 타입이 왜 필요한지
            * 동적 타이핑이 무엇인지
                를 한 줄씩 설명하기
        */

        let num = 10;
        let str = 'string';
        let name = '홍길동';
        let result = `안녕하세요 ${name}입니다`;
        let bool = true;
        let undefi;
        let nul = null;
        let sym = Symbol('obj');
        // 객체 변수
        let user = { 
            name: '홍길동', 
            age: 20
        };

        console.log(typeof bool);
        console.log(typeof str);
        console.log(typeof sym);

        /*
            데이터 타입이 필요한 이유 : 데이터 타입은 값을 저장하고 참조할 때 메모리를 효율적으로 사용하기 위해 필요하다
            동적 타이핑 : 자바스크립트는 변수 타입이 고정되지 않고 값에 따라 타입이 동적으로 변경된다
        */
    </script>
