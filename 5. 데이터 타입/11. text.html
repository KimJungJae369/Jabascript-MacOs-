<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        isNaN : 값이 NaN인지 판별하는 함수
        - NaN : Not a Number의 약자로 숫자가 아님을 나타내는 특별한 값
    -->

    <script>
        /*
            요구사항
            1. id, age는 숫자 타입으로 변환
            2. isActive는 불리언 타입으로 변환
            3. name을 이용해
                👉 "User John (101)" 형식의 템플릿 리터럴 문자열 생성
            4. lastLogin이
                * null이면 "No login history"
                * 값이 있으면 그대로 출력
            5. 존재하지 않는 값(undefined)이 들어올 경우를 대비한 처리 포함
            6. 결과를 객체로 반환
        */
        const user = {
            id: "101",
            name: "John",
            age: "20",
            isActive: "true",
            lastLogin: undefined
        };

        function transformUser(user) {
            const id = Number(user.id);
            const age = Number(user.age);
            const isActive = user.isActive === "true";

            const displayName = `User ${user.name} (${id})`;

            let lastLogin;
            if (user.lastLogin === null) {
                lastLogin = 'No login history';
            } else if (user.lastLogin === undefined) {
                lastLogin = 'Unknown';
            } else {
                lastLogin = user.lastLogin;
            }

            return {
                id,
                age,
                isActive,
                displayName,
                lastLogin
            };
        }

        console.log(transformUser(user));
    </script>
    
</body>
</html>
