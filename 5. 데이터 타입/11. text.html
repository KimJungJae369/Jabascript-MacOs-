<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        isNaN : 값이 NaN인지 판별하는 함수
        - NaN : Not a Number의 약자로 숫자가 아님을 나타내는 특별한 값

        데이터 타입이 필요한 이유 : 데이터 타입은 값을 저장하고 참조할 때 메모리를 효율적으로 사용하기 위해 필요하다
        동적 타이핑 : 자바스크립트는 변수 타입이 고정되지 않고 값에 따라 타입이 동적으로 변경된다

            undefined: 변수는 존재하지만 값이 자동으로 할당되지 않은 상태
            null: 개발자가 의도적으로 ‘값이 없음’을 나타내기 위해 넣은 
    -->

    <script>
        /*
            1. 숫자 타입 변수 age를 만들고 20을 저장한다.
            2. 문자열 타입 변수 name을 만들고 "김철수"를 저장한다.
            3. 템플릿 리터럴을 사용해 "김철수의 나이는 20살입니다."를 출력한다.
            4. 불리언 타입 변수 isAdult를 만들고 true를 저장한다.
            5. undefined 상태인 변수를 하나 선언한다.
            6. null을 저장하는 변수를 하나 만든다.
            7. **객체(Object)**를 하나 만들고 name과 age를 저장한다.
            8. typeof를 사용해서 age, name, isAdult, undefined 변수, 객체의 타입을 출력한다.
        */

        let age = 20;
        let name = '김철수';
        console.log(`${name}의 나이는 ${age}살입니다`);
        let isAdult = true;
        let unde;
        let nulled = null;
        let userName = {
            name : '홍길동',
            age : 30,
        }

        console.log(typeof age);
        console.log(typeof name);
        console.log(typeof isAdult);
        console.log(typeof unde);
        console.log(typeof userName);
    </script>
    
</body>
</html>
