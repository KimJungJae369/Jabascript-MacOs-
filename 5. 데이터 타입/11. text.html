<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        isNaN : 값이 NaN인지 판별하는 함수
        - NaN : Not a Number의 약자로 숫자가 아님을 나타내는 특별한 값
    -->

    <script>
        // 사용자 객체 생성
        const user = {
            name : '홍길동',
            age : 30,
            isLoggedIn : true
        } 

        // 템플릿 리터럴 출력
        console.log(`${user.name} - ${user.age}`); // 홍길동 - 30

        // 존재하지 않는 값 -> undefined
        console.log(user.address); // undefined

        // 일부 값 -> null로 의도적 초기화
        console.log(user.isLoggedIn); // true
        user.isLoggedIn = null;
        console.log(user.isLoggedIn); // null

        // 심벌을 사용해서 유일한 키 하나 추가
        const userId = Symbol('id');
        console.log(typeof userId); // symbol
        user[userId] = 'user1';
        console.log(user[userId]); // user1

        // 변수 하나 만들기 : 처음엔 숫자, 나중에  문자열로 변경(동적 타이핑)
        let variable = 123;
        console.log(variable); // 123

        variable = '문자열로 변경';
        console.log(variable); // 문자열로 변경
    </script>
    
</body>
</html>
