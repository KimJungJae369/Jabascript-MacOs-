<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        isNaN : 값이 NaN인지 판별하는 함수
        - NaN : Not a Number의 약자로 숫자가 아님을 나타내는 특별한 값

        데이터 타입이 필요한 이유 : 데이터 타입은 값을 저장하고 참조할 때 메모리를 효율적으로 사용하기 위해 필요하다
        동적 타이핑 : 자바스크립트는 변수 타입이 고정되지 않고 값에 따라 타입이 동적으로 변경된다

            undefined: 변수는 존재하지만 값이 자동으로 할당되지 않은 상태
            null: 개발자가 의도적으로 ‘값이 없음’을 나타내기 위해 넣은 
    -->

    <script>
        /*
            1. 이름 → "김철수"
            2. 나이 → 25
            3. 성인 여부 → true
            4. 전화번호 → "010-1234-5678"
            5. 보유 포인트 → 12500
            6. 자기소개 → null
            7. 주소 → undefined
                    
            그리고 typeof를 사용해서 각 변수의 데이터 타입을 확인해봐.
        */

        
        
        let name = '김철수';
        let age = 25;
        let isAdult = true;
        let tel = '010-1234-5678';
        let point = 12500;
        let introduction = null;
        let Address;

        console.log(typeof name);
        console.log(typeof age);
        console.log(typeof isAdult);
        console.log(typeof tel);
        console.log(typeof point);
        console.log(typeof introduction);
        console.log(typeof Address);
    </script>
    
</body>
</html>
