<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        isNaN : 값이 NaN인지 판별하는 함수
        - NaN : Not a Number의 약자로 숫자가 아님을 나타내는 특별한 값
    -->

    <script>
        let userAge = 20;
        console.log(`나이는 ${userAge}입니다`);

        let str = "hello"; // 문자열
        let bool = true;
        console.log(bool);

        let x;
        console.log(x); // undefined

        let y = null;
        console.log(y); // null

        let sym = Symbol('id');
        console.log(typeof sym); // symbol

        let obj = {};
        console.log(typeof obj); // object

        // 동적 타이핑
        let dynamic = 10;
        dynamic = "문자열";
    </script>
    
</body>
</html>
