<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        isNaN : 값이 NaN인지 판별하는 함수
        - NaN : Not a Number의 약자로 숫자가 아님을 나타내는 특별한 값

        데이터 타입이 필요한 이유 : 데이터 타입은 값을 저장하고 참조할 때 메모리를 효율적으로 사용하기 위해 필요하다
        동적 타이핑 : 자바스크립트는 변수 타입이 고정되지 않고 값에 따라 타입이 동적으로 변경된다

            undefined: 변수는 존재하지만 값이 자동으로 할당되지 않은 상태
            null: 개발자가 의도적으로 ‘값이 없음’을 나타내기 위해 넣은 
    -->

    <script>
        /*
            1. name 변수에 문자열 "철수"를 저장한다.
            2. age 변수에 숫자 20을 저장한다.
            3. isStudent 변수에 불리언 true를 저장한다.
            4. address 변수는 선언만 하고 값은 넣지 않는다.
            5. phone 변수에는 의도적으로 값이 없음을 나타내도록 저장한다.
            6. id 변수에는 Symbol 값을 저장한다.
            7. user 변수에는 { name, age } 형태의 객체를 저장한다.
            8. 템플릿 리터럴을 사용하여 아래와 같이 출력한다.
        */

        let name = '철수';
        let age = 20;
        let isStudent = true;
        let address; // 언디파인드 타입
        let phone = null; // 널타입
        let id = Symbol('심벌');
        let user = {
            name : '맹구',
            age : 30,
        }
        console.log(`이름 : ${name}, 나이 : ${age}`);
    </script>
    
</body>
</html>
