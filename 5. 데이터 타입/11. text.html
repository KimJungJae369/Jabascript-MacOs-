<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>
</head>
<body>

    <!-- 
        isNaN : 값이 NaN인지 판별하는 함수
        - NaN : Not a Number의 약자로 숫자가 아님을 나타내는 특별한 값
    -->

    <script>
        let inputPrice = "10000";
        let bonus = 2000;
        // let totalPrice = price + bonus; // price가 NaN인 경우, totalPrice도 NaN이 된다

        // 타입 변환
        let price = Number(inputPrice);
        let totalPrice = price + bonus; // price가 NaN인 경우, totalPrice도 NaN이 된다
        
        // 유효성 검사
        if (isNaN(price)) { // price가 NaN인 경우, 즉 유효한 숫자가 아닌 경우
            console.log("잘못된 입력입니다");
        } else {
            console.log(`총 결제 금액: ${totalPrice}원`);
        }
    </script>
    
</body>
</html>
