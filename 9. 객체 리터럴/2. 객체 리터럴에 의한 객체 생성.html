<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체 리터럴에 의한 객체 생성</title>
</head>
<body>

    <!-- 
        객체 리터럴에 의한 객체 생성
        = 클래스 기반 객체지향 언어는 클래스를 사전에 정의하고 필요한 시점에 'new 연산자'와 함께 생성자를 호출하여 '인스턴스'를 생성하는 방식으로 객체를 생성
        <인스턴스>
            - 클래스에 의해 생성되어 메모리에 저장된 실체 
            - 객체지향 프로그래밍에서 객체는 클래스와 인스턴스를 포함한 개념
            - 클래스는 인스턴스를 생성하기 위한 템플릿의 역할을 한다 인스턴스는 객체가 메모리에 저장되어 실제로 존재하는 것에 초점을 맞춘 용어

        = 자바스크립트는 프로토타입 기반 객체지향 언어로서 클래스 기반 객체지향 언어와는 달리 다양한 객체 생성 방법을 지원
            - 객체 리터럴
            - Object 생성자 함수
            - 생성자 함수 
            - Object.create 메서드
            - 클래스(ES6)

        = 리터럴은 사람이 이해할 수 있는 문자 또는 약속된 기호를 사용하여 값을 생성하는 표기법
        = 객체 리터럴은 중괄호 내에 0개 이상의 프로퍼티를 정의
        = 객체 리터럴의 중괄호는 코드 블록을 의미하지 않는다는 데 주의
        = 객체 리터럴은 자바스크립트의 유연함과 깅력함을 대표하는 객체 생성 방식
        = 객체 리터럴 외의 객체 생성 방식은 모두 함수를 사용해 객체를 생성
    -->

    <script>
        let preson = {
            name : 'lee',
            sayHello : function(){
                console.log(`Hello My name ${this.name}`);
            }
        }
        console.log(typeof preson); // object
        console.log(preson);
        /*
            {name: 'lee', sayHello: ƒ}
            name: "lee"
            sayHello: ƒ ()
            [[Prototype]]: Object
        */



        let empty = {};
        console.log(empty); // Object
    </script>
    
</body>
</html>
