<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체란</title>
</head>
<body>

    <!-- 
        객체란?
        = 자바스크립트는 객체 기반 프로그래밍 언어이며 자바스크립트를 구성하는 거의 '모든 것'이 객체
        = 원시 값(변수에 저장할 수 있는 가장 기본적인 데이터 값[string, number, boolean, undefined, null, symbol,...])을 제외한 나머지 값(함수, 배열, 정규 표현식, 등...)은 모두 객체
        = 원시 타입은 단 하나의 값만 나타내지만 객체 타입은 다양한 타입의 값(원시 값 또는 다른 객체)을 하나의 단위로 구성한 복합적인 자료구조
        = 원시 타입의 값 즉 원시 값은 변경 불가능한 값이지만 객체 타입의 값 즉 객체는 변경 가능한 값
            ex)
                var person = {
                    name : 'Lee'; = 프로퍼티 키(key) : 프로퍼티 값(value) = 프로퍼티;
                }

        = 자바스크립트에서 사용할 수 있는 모든 값은 프로퍼티 값이 될 수 있다
        = 자바스크립트의 함수는 일급 객체 이므로 값으로 취급
            일급 객체 : 중요한 개념, 다른 값처럼 자유롭게 사용할 수 있는 객체
        = 따라서 함수도 프로퍼티 값 으로 사용할 수 있다 프로퍼티 값이 함수일 경우 일반 함수의 구분하기 위해 '메서드'라 부른다
            ex)
                num : 0; -> 프로퍼티 : 객체의 상태를 나타내는 값

                increase : function(){ -> 메서드 : 프로퍼티(상태 데이터)를 참조하고 조작할 수 있는 동작
                    this.num++;
                }

        = 객체의 상태를 나타내는 값(프로파티)과 프로퍼티를 참조하고 조작할 수 있는 동작(메서드)을 모두 포함할 수 있기 때문에 상태와 동작을 하나의 단위로 구조화할 수 있어 유용하다

        <객체와 함수>
        - 함수로 객체를 생성하기도 하며 함수 자체가 객체이기도 하다
        - 자바스크립트에서 함수와 객체는 분리해서 생각할 수 없는 개념이다
        - 즉 객체를 이해해야 함수를 제대로 이해할 수 있고 반대로 함수를 이해해야 객체를 정확히 이해할 수 있다
    -->
    
</body>
</html>
