<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로퍼티</title>
</head>
<body>

    <!-- 
        프로퍼티
        = 객체는 프로퍼티의 집합이며 프로퍼티는 '키'와 '값'으로 구성
        = 프로퍼티를 나열할 때는 쉼표(,)로 구분
        = 일반적으로 마지막 프로퍼티 뒤에는 쉼표를 사용하지 않으나 사용해도 좋다
            프로퍼티 키 : 빈 문자열을 포함하는 모든 문자열 또는 심벌 값
            프로퍼티 값 : 자바스크립트에서 사용할 수 있는 모든 값

        = 프로퍼티 '키'는 프로퍼티 '값'에 접근할 수 있는 이름으로서 식별자 역할을 한다
        = 하지만 반드시 식별자 네이밍 규칙을 따라야 하는 것은 아니다 
        = 식별자 네이밍 규칙을 따르지 않는 이름에는 반드시 따옴표를 사용
        = 문자열 또는 문자열 평가할 수 있는 표현식을 사용해 프로퍼티 '키'를 동적으로 생성할 수 있다 이 경우에는 프로퍼티 키로 사용할 표현식을 대괄호로 묶어야 한다
        = 빈 문자열을 프로퍼티 키로 사용해도 에러가 발생하지 않는다 하지만 키로서의 의미를 갖지 못하므로 권장하지 않는다
        = 프로퍼티 키에 문자열이나 심벌 값 외의 값을 사용하면 암묵적 타입 변환을 통해 문자열이 된다
        = 'var', 'function'과 같은 에약어를 프로퍼티 키로 사용해도 에러가 발생하지 않는다 하지만 예상치 못한 에러가 발생할 여지가 있으므로 권장하지 않는다
        = 이미 존재하는 프로퍼티 키를 중복 선언하면 나중에 프로퍼티가 먼저 선언한 프로퍼티를 덮어쓴다 이때 에러가 발생하지 않는다는 점에 주의
    -->
    
    <script>
        let person = {
            name : 'Lee', // 프로퍼티 키 : name / 프로퍼티 값 : 'Lee'
            age : 20 , // 프로퍼티 키 : age / 프로퍼티 값 : 20
        }

        let person2 = {
            firstName : "Ung-mo", // 식별자 네이밍 규칙을 준수O
            'last-name' : 'Lee' // 식별자 네이밍 규칙을 준수X
        }
        console.log(person2); // firstName : "Ung-mo" / last-name : "Lee"

        // let person3 = {
        //     firstName : "Ung-mo",
        //     last-name : 'Lee' // 오류

        //     console.log(person2);
        // }

        let obj = {};
        let key = 'hello';

        obj[key] = 'world'

        console.log(obj); // hello : "world"


        let foo = {
            '' : ''
        }
        console.log(foo); // "" : ""


        let foo2 = {
            0 : 1,
            1 : 2,
            2 : 3
        }
        console.log(foo2); // {0: 1, 1: 2, 2: 3}


        let foo3 = {
            let : '',
            function : ''
        }
        console.log(foo3); // {let: '', function: ''}

        let foo4 = {
            name : 'Lee',
            name : 'Kim'
        }
        console.log(foo4); // {name: 'Kim'}
    </script>
</body>
</html>
