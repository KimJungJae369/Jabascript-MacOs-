<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메서드</title>
</head>
<body>

    <!-- 
        메서드
        = 자바스크립트에서 사용할 수 있는 모든 값은 프로퍼티 값으로 사용할 수 있다
        = 자바스크립트의 함수는 '객체(일급객체)'이다
        = 따라서 함수는 값으로 취급할 수 있기 때문에 프로퍼티 값으로 사용할 수 있다
        = 프로퍼티 값이 함수일 경우 일반 함수와 구분하기 위해 '메서드'라 부른다 즉 메서드는 객체에 묶여 있는 함수를 의미 
    -->

    <script>
        let circle = {
            radius : 5, // 프로퍼티

            // 원의 지름
            getDiameter : function(){ // 메서드
                return 2 * this.radius; // this는 'circle'을 가리킨다
            }
        }
        console.log(circle.getDiameter()); // 10
    </script>
    
</body>
</html>
