<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로퍼티 접근</title>
</head>
<body>
    
    <!-- 
        프로퍼티 접근
        <프로퍼티 접근 방법>
        1. 마침표 프로퍼티 접근 연산자(.)를 사용하는 '마침표 표기법'
        2. 대괄호 프로퍼티 접근 연산자([])를 사용하는 '대괄호 표기법'

        = 프로퍼티 키가 식별자 네이밍 규칙을 준수하는 이름 즉 자바스크립트에서 사용 가능한 유효한 이름
        = 프로퍼티 키가 식별자 네이밍 규칙을 준수하지 않는 이름 즉 자바스크립트에서 사용 가능한 유효한 이름이 아니면 반드시 '괄호 표기법'을 사용
        = 단 프로퍼티 키가 숫자로 이뤄진 문자열인 경우 따옴표를 생략할 수 있다
    -->

    <script>
        let person = {
            name : 'Lee'
        }
        // 마침표 표기법의한 프로퍼티 접근
        console.log(person.name); // Lee
        // 대괄호 표기법의한 프로퍼티 접근
        console.log(person['name']); // Lee

        // undefined 반환 예시        
        console.log(person[name]); // undefined : '대괄호 프로퍼티 접근 연산자' 내부에 지정하는 프로퍼티 키는 반드시 따옴표로 감싼 문자열이어야 한다
        console.log(person.age); // undefined : 객체에 존재하지 않는 프로퍼티에 접근하면 undefined를 반환
        

        let person2 = {
            'last-name' : 'Lee',
            1 : 10
        }

        // person2.'last-name'; // SyntaxError : '마침표 프로퍼티 접근 연산자'는 식별자 네이밍 규칙을 준수하는 이름만 사용할 수 있다
        // person2.last-name; // SyntaxError : '마침표 프로퍼티 접근 연산자'는 식별자 네이밍 규칙을 준수하는 이름만 사용할 수 있다

        // person2[last-name]; // ReferenceError : '대괄호 프로퍼티 접근 연산자' 내부에 지정하는 프로퍼티 키는 반드시 따옴표로 감싼 문자열이어야 한다
        // person2['last-name']; // Lee : '대괄호 프로퍼티 접근 연산자' 내부에 지정하는 프로퍼티 키는 반드시 따옴표로 감싼 문자열이어야 한다

        // 프로퍼티 키가 숫자로 이뤄진 문자열인 경우 따옴표를 생략할 수 있다
        // person2.1; // SyntaxError : '마침표 프로퍼티 접근 연산자'는 식별자 네이밍 규칙을 준수하는 이름만 사용할 수 있다
        // person2.'1'; // SyntaxError : '마침표 프로퍼티 접근 연산자'는 식별자 네이밍 규칙을 준수하는 이름만 사용할 수 있다
        // person2[1]; // 10 : '대괄호 프로퍼티 접근 연산자' 내부에 지정하는 프로퍼티 키는 반드시 따옴표로 감싼 문자열이어야 한다
        // person2['1']; // 10 : '대괄호 프로퍼티 접근 연산자' 내부에 지정하는 프로퍼티 키는 반드시 따옴표로 감싼 문자열이어야 한다
    </script>
    
</body>
</html>
